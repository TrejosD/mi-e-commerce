<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi E-commerce</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="head bg-blue">
        <h1>Mi E-commerce</h1>
      </header>
      <menu class="side-menu">
        <div class="menu">
          <h3>Categorías</h3>
          <ul class="menu-items">
            <li>Perfumes <span>(13)</span></li>
            <li>Ropa <span>(21)</span></li>
            <li>Accesorios <span>(41)</span></li>
            <li>Zapatos <span>(10)</span></li>
          </ul>
        </div>
      </menu>
      <main class="contain">
        <div class="card">
          <img class="img" src="./assets/imgs/watch.png" alt="" />
          <h2>Card title</h2>
          <p>$20.000</p>
          <button class="bg-blue">Comprar</button>
        </div>
        <div class="card">
          <img class="img" src="./assets/imgs/zapatos.png" alt="" />
          <h2>Card title</h2>
          <p>$37.800</p>
          <button class="bg-blue">Comprar</button>
        </div>
        <div class="card">
          <img class="img" src="./assets/imgs/shirt.png" alt="" />
          <h2>Card title</h2>
          <p>$9.400</p>
          <button class="bg-blue">Comprar</button>
        </div>
        <div class="card">
          <img class="img" src="./assets/imgs/perfum.webp" alt="" />
          <h2>Card title</h2>
          <p>$52.080</p>
          <button class="bg-blue">Comprar</button>
        </div>
      </main>
      <footer class="foot">
        <p>@mie-commerce</p>
      </footer>
    </div>
  </body>
</html>
